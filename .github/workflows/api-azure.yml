name: Deploy .NET 8 App to Azure Container App

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend-api
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/backend-api:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_BACKEND}}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name geji-backend-web-app \
            --resource-group geji-resource-group \
            --image ${{ secrets.DOCKER_USERNAME }}/backend-api:latest
